<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/novo-favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- App instalado (tela inicial do iPhone/iPad, Dock do Mac, Android, Windows) -->
    <meta name="application-name" content="Ensine Música" />
    <meta name="apple-mobile-web-app-title" content="Ensine Música" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f5f1ea" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica o tema antes da página aparecer, para não piscar o tema errado.
      // Usa a escolha salva do visitante; sem escolha, segue o sistema.
      // Mantenha em sincronia com src/componentes/Tema.js.
      (function () {
        var tema;
        try {
          tema = localStorage.getItem("ensine-musica:tema");
        } catch (e) {}
        if (tema !== "light" && tema !== "dark") {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = tema;
        document.querySelector('meta[name="theme-color"]').content = tema === "dark" ? "#12100e" : "#f5f1ea";
      })();
    </script>
    <meta name="language" content="Portuguese" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <title>Ensine Música - Recursos e Projetos para Educação Musical</title>
    <meta name="description" content="Explore recursos, projetos inovadores e ideias práticas para ensinar música. Descubra conteúdos exclusivos para educação musical e dicas para professores." />

    <!-- Prévia do link no WhatsApp, Facebook, Telegram etc. As redes exigem endereços
         completos: VITE_SITE_URL vem do arquivo .env.production. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Ensine Música" />
    <meta property="og:title" content="Ensine Música — Música se aprende fazendo" />
    <meta property="og:description" content="Tutoriais de instrumentos e jogos musicais feitos com materiais alternativos, criados por estudantes para inspirar professores de música." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ensine Música — Música se aprende fazendo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="google-site-verification" content="bzK2Ol1Uk4SoricVL5Vzyw1zPAqEbZ7h-yXnQHgOun0" />
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o Ensine Música.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
