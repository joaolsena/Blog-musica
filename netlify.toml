# Configuração de publicação do site no Netlify.
# O Netlify instala as dependências e compila o site (Vite) a partir do
# código-fonte, por isso a pasta blog/dist não fica no Git.
[build]
  base = "blog"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Defina VITE_API_URL (endereço do servidor) nas variáveis de ambiente do
# site no painel do Netlify: Site configuration > Environment variables.
